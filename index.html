<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Ciné Quiz</title>
<style>
  :root{
    --bg:#0a0c0c; --ink:#0a0c0c;
    --cyan:#c6f0c0; --mint:#c6f0c0; --dim:#6f8a72;   /* main color = mint green (no blue chrome) */
    --good:#147a3a; --bad:#b3261e;
    --stock:#c6f0c0;                 /* current ticket-stock color (set per round) */
    /* per-stage pastel palettes (all light → black ink reads): mint→butter→apricot→rose→lilac */
    --easy:#c6f0c0; --medium:#efe6a0; --hard:#f2cb9f; --veryhard:#efb1ab; --cinephile:#cdbef0;
    --serif:"Georgia","Times New Roman",serif;
    --cond:"Arial Narrow","Helvetica Neue",Helvetica,Arial,sans-serif;
  }
  *{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
  html,body{margin:0;color:var(--cyan);font-family:var(--cond);background:var(--bg)}
  body{display:flex;justify-content:center;min-height:100dvh}
  #app{width:100%;max-width:460px;padding:16px 14px calc(16px + env(safe-area-inset-bottom));display:flex;flex-direction:column;gap:14px}

  .meta{font-size:11px;letter-spacing:.22em;text-transform:uppercase;color:var(--dim)}

  /* top marquee (on black) */
  .topbar{display:flex;align-items:center;justify-content:space-between;gap:10px}
  .logo{border:2px solid var(--cyan);color:var(--cyan);font-weight:800;letter-spacing:.16em;
        text-transform:uppercase;font-size:14px;padding:7px 12px}
  .chip{background:transparent;color:var(--stock);border:2px solid var(--stock);border-radius:999px;
        padding:5px 13px;font-size:11px;letter-spacing:.18em;text-transform:uppercase;font-weight:800}

  /* rank ladder — sideways admission ticket (green stock, scalloped ends) */
  .ladder{padding:13px 26px;display:flex;flex-direction:column;gap:9px}
  .ladder .row{display:flex;justify-content:space-between;align-items:baseline}
  .ladder .meta{color:rgba(10,12,12,.65)}
  .ladder .score{font-family:var(--cond);font-size:24px;font-weight:800;color:var(--ink)}
  .ladder .score small{font-size:12px;color:rgba(10,12,12,.55);font-weight:600}
  .track{position:relative;height:13px;border:2px solid var(--ink);border-radius:999px;overflow:hidden;background:#0a0c0c}
  .fill{position:absolute;inset:0 100% 0 0;transition:right .5s ease, background .3s}
  .ticks{position:absolute;inset:0;display:flex;pointer-events:none}
  .ticks span{flex:1;border-right:1px solid rgba(255,255,255,.16)}
  .ticks span:last-child{border-right:0}
  .bands{display:flex;gap:5px}
  .bands b{flex:1;text-align:center;font-size:9px;letter-spacing:.04em;text-transform:uppercase;
           color:rgba(10,12,12,.5);font-weight:800;padding:4px 0;border-radius:999px;border:1.5px solid rgba(10,12,12,.35)}
  .bands b.done{opacity:.5}

  /* movie-ticket card */
  .stock{background:var(--stock);color:var(--ink);position:relative;border-radius:4px}
  /* scalloped edges: one evenly-spaced flex row of arches, bigger one in the middle */
  .scallop{position:absolute;left:0;right:0;display:flex;justify-content:space-between;align-items:center;
    padding:0 10px;pointer-events:none;z-index:1}
  .scallop.top{top:0;align-items:flex-start}
  .scallop.bottom{bottom:0;align-items:flex-end}
  .scallop i{flex:0 0 auto;width:28px;height:14px;background:var(--bg)}
  .scallop.top i{border-radius:0 0 99px 99px}
  .scallop.bottom i{border-radius:99px 99px 0 0}
  .scallop i.big{width:48px;height:24px}
  /* sideways ticket: small uniform arches on the left/right ends */
  .scallop.left,.scallop.right{left:auto;right:auto;top:0;bottom:0;flex-direction:column;justify-content:space-around;padding:6px 0}
  .scallop.left{left:0;align-items:flex-start}
  .scallop.right{right:0;align-items:flex-end}
  .scallop.left i,.scallop.right i{width:10px;height:16px}
  .scallop.left i{border-radius:0 99px 99px 0}
  .scallop.right i{border-radius:99px 0 0 99px}

  /* internal perforation separators */
  .perf{height:0;border-top:2px dashed rgba(10,12,12,.4);margin:0 18px}

  .ticket{padding:0}
  .ticket .body{padding:8px 18px 12px;display:flex;flex-direction:column;gap:11px}
  .stub{display:flex;align-items:center;justify-content:space-between;
        padding:34px 18px 11px;
        text-transform:uppercase;font-weight:800;letter-spacing:.26em;font-size:13px;color:var(--ink)}
  .stub .serial{opacity:.6;font-variant-numeric:tabular-nums;letter-spacing:.14em}
  .foot{padding:10px 18px 32px;text-align:center;text-transform:uppercase;
        letter-spacing:.3em;font-size:10px;font-weight:800;color:rgba(10,12,12,.6)}

  .framewrap{position:relative;border:2px solid var(--ink);overflow:hidden;aspect-ratio:16/9;background:#000}
  canvas{display:block;width:100%;height:100%;touch-action:manipulation}

  .potbar{display:flex;align-items:center;gap:10px;border-top:2px dashed rgba(10,12,12,.45);padding-top:11px}
  .pot{font-family:var(--cond);font-size:32px;font-weight:800;color:var(--ink);font-variant-numeric:tabular-nums;line-height:1}
  .potlabel{font-size:9px;letter-spacing:.2em;text-transform:uppercase;color:rgba(10,12,12,.7);line-height:1.3;font-weight:700}
  .streak{margin-left:auto;font-size:11px;letter-spacing:.14em;text-transform:uppercase;color:var(--ink);font-weight:800}
  /* lives — five little movie tickets in a row at the bottom; burn on a miss, earn back on a 5-streak */
  .lives{display:flex;gap:7px;align-items:center;justify-content:center;width:100%;padding-top:4px}
  .life{width:26px;height:15px;flex:0 0 auto;position:relative;border:2px solid var(--cyan);border-radius:3px;background:var(--cyan);
    -webkit-mask:radial-gradient(circle 4px at 0 50%,#0000 96%,#000),radial-gradient(circle 4px at 100% 50%,#0000 96%,#000);
            mask:radial-gradient(circle 4px at 0 50%,#0000 96%,#000),radial-gradient(circle 4px at 100% 50%,#0000 96%,#000);
    -webkit-mask-composite:source-in;mask-composite:intersect;transition:opacity .2s ease}
  .life::after{content:"";position:absolute;left:50%;top:2px;bottom:2px;transform:translateX(-50%);border-left:1.5px dashed var(--bg);opacity:.4}
  .life.spent{background:transparent;border-color:rgba(150,110,90,.45);opacity:.5}
  .life.spent::after{border-color:rgba(150,110,90,.45)}
  .life.burning{animation:ticketBurn .6s ease-in forwards;z-index:2}
  @keyframes ticketBurn{
    0%{opacity:1;transform:scale(1) rotate(0);filter:none}
    18%{filter:brightness(1.7) saturate(3) drop-shadow(0 0 5px rgba(255,130,0,.95))}
    50%{background:#3a1607;border-color:#ff7a18;transform:scale(.92) rotate(-6deg);filter:saturate(2) drop-shadow(0 0 8px rgba(255,95,0,.9))}
    100%{background:transparent;border-color:rgba(150,110,90,.45);transform:scale(.88) rotate(2deg) translateY(3px);opacity:.5;filter:none}
  }
  /* earn a ticket back (5 correct in a row): a fresh ticket prints in with a pop */
  .life.earned{animation:ticketEarn .5s ease-out}
  @keyframes ticketEarn{
    0%{transform:scale(.2) rotate(-12deg);opacity:0;filter:brightness(2)}
    55%{transform:scale(1.2) rotate(4deg);opacity:1;filter:brightness(1.4) drop-shadow(0 0 5px rgba(255,255,255,.85))}
    100%{transform:scale(1) rotate(0);opacity:1;filter:none}
  }
  /* hot streak: full tickets + 5 in a row → shiny holographic foil */
  .life.shiny{background:linear-gradient(115deg,#ff6b9d 0%,#ffd86b 18%,#7bffb0 38%,#6bd5ff 58%,#c89bff 78%,#ff6b9d 100%);
    background-size:300% 100%;border-color:#fff;animation:holoShine 1.4s linear infinite;filter:drop-shadow(0 0 4px rgba(255,255,255,.55))}
  .life.shiny::after{border-color:rgba(10,12,12,.6)}
  @keyframes holoShine{from{background-position:0 0}to{background-position:300% 0}}
  .streak.hot{color:#ff8a3d;text-shadow:0 0 8px rgba(255,138,61,.6)}
  @media (prefers-reduced-motion: reduce){ .life.burning,.life.earned{animation-duration:.01s} .life.shiny{animation:none} }
  .hint{font-size:12px;color:rgba(10,12,12,.62);text-align:center;letter-spacing:.02em;font-style:italic;font-family:var(--serif)}

  /* choices (black ink on stock) */
  .choices{display:flex;flex-direction:column;gap:8px}
  .choice{font-family:var(--serif);font-size:16px;text-align:left;color:var(--ink);background:transparent;
          border:2px solid var(--ink);border-radius:3px;padding:12px 14px;cursor:pointer;
          transition:background .12s,color .12s}
  .choice:hover{background:rgba(10,12,12,.10)}
  .choice:disabled{cursor:default}
  .choice.correct{border-color:var(--good);background:rgba(20,122,58,.16);color:var(--good);font-weight:700}
  .choice.wrong{border-color:var(--bad);background:rgba(179,38,30,.14);color:var(--bad)}

  /* overlays */
  .overlay{position:fixed;inset:0;background:rgba(5,7,7,.88);display:flex;align-items:center;justify-content:center;padding:18px;z-index:10}
  .panel{width:100%;max-width:430px;padding:0}
  .panel .pad{padding:36px 24px 36px;display:flex;flex-direction:column;gap:14px;text-align:center}
  .panel h1{font-family:var(--cond);font-weight:800;text-transform:uppercase;letter-spacing:.12em;font-size:30px;margin:0;color:var(--ink)}
  .panel h2{font-family:var(--serif);font-size:27px;margin:0;line-height:1.15;color:var(--ink)}
  .panel .result{font-weight:800;text-transform:uppercase;letter-spacing:.2em;font-size:13px}
  .panel .delta{font-family:var(--cond);font-size:38px;font-weight:800}
  #rvFrame{width:100%;aspect-ratio:16/9;object-fit:contain;background:#000;border:2px solid var(--ink);border-radius:3px;display:block}
  .panel ul{list-style:none;margin:0;padding:0;font-size:11px;letter-spacing:.16em;text-transform:uppercase;color:rgba(10,12,12,.7);display:flex;flex-direction:column;gap:4px}
  .btn{font-family:var(--cond);font-weight:800;text-transform:uppercase;letter-spacing:.16em;font-size:14px;
       border:2px solid var(--ink);color:var(--stock);background:var(--ink);border-radius:3px;padding:14px;cursor:pointer}
  .rules{font-size:13px;line-height:1.65;color:var(--ink);text-align:left;font-family:var(--serif)}
  .rules b{font-weight:700}
  .lblink{font-family:var(--cond);font-weight:700;text-transform:uppercase;letter-spacing:.16em;font-size:11px;
          color:var(--ink);text-decoration:none;border-bottom:1.5px solid var(--ink);align-self:center;
          padding-bottom:1px;opacity:.75;transition:opacity .15s ease}
  .lblink:hover{opacity:1}
  /* Reel Score breakdown on the win / game-over screens */
  .scorebox{display:flex;flex-direction:column;align-items:center;gap:8px;width:100%}
  .scorebox .bigscore{font-family:var(--cond);font-weight:800;font-size:52px;line-height:.95;color:var(--ink)}
  .scorebox .scoresub{font-family:var(--cond);font-weight:700;text-transform:uppercase;letter-spacing:.22em;font-size:10px;color:rgba(10,12,12,.6)}
  .scorebox ul.scorelines{font-size:11px;letter-spacing:.1em;text-transform:uppercase;color:rgba(10,12,12,.72);gap:3px;margin-top:4px;align-items:center}
  .scorebox ul.scorelines b{color:var(--ink)}
  .scorebox ul.scorelines .dim{opacity:.55}
  .winbtns{display:flex;gap:10px;width:100%}
  .winbtns .btn{flex:1}
  .btn.ghost{background:transparent;color:var(--ink)}
  .btn.ghost:hover{background:var(--ink);color:var(--stock)}
  /* infinite-mode strike pips in the rank bar */
  .strikes{display:inline-flex;gap:5px;align-items:center;margin-left:8px}
  .strikes i{width:10px;height:10px;border-radius:50%;border:2px solid var(--ink);display:inline-block}
  .strikes i.spent{background:var(--bad);border-color:var(--bad)}

  /* main menu — the ticket IS the button */
  /* opaque page-black so the game ticket behind doesn't bleed through as a faint box (the menu sits on clean bg) */
  #menuOv{background:var(--bg);transition:background .5s ease}
  #menuOv.ripping{background:transparent}
  /* fade the non-ticket menu controls out the instant the tear starts (they're siblings of the ticket, not part of it) */
  .stagepick,.obscurity{transition:opacity .2s ease}
  #menuOv.ripping .stagepick,#menuOv.ripping .obscurity{opacity:0;pointer-events:none}
  .menuticket{border:0;font:inherit;cursor:pointer;display:block;width:100%;max-width:430px;text-align:center;
    transition:transform .15s ease}
  .menuticket:hover{transform:translateY(-2px)}
  .menuticket:active{transform:translateY(0)}
  .menuticket .meta{color:rgba(10,12,12,.6)}
  .menuticket .enter{font-family:var(--cond);font-weight:800;text-transform:uppercase;letter-spacing:.16em;font-size:22px;
    color:var(--stock);background:var(--ink);border-radius:3px;padding:15px;margin-top:6px}
  .menuticket .tearhint{margin-top:4px;font-size:10px}

  /* stage picker under the ticket */
  .menuwrap{display:flex;flex-direction:column;align-items:center;gap:20px;width:100%;max-width:430px}
  .stagepick{display:flex;flex-direction:column;align-items:center;gap:9px;width:100%}
  .stagepick .picklabel{color:var(--dim);letter-spacing:.26em}
  /* obscurity slider */
  .obscurity{display:flex;flex-direction:column;align-items:center;gap:9px;width:100%;max-width:320px}
  .obscurity .picklabel{color:var(--dim);letter-spacing:.26em;font-size:11px;text-transform:uppercase;font-family:var(--cond);font-weight:700}
  .obscurity .picklabel span{color:var(--stock)}
  .obscurity .obshint{color:var(--dim);opacity:.7;font-size:10px;letter-spacing:.1em;text-transform:uppercase;font-family:var(--cond)}
  #obsSlider{-webkit-appearance:none;appearance:none;width:100%;height:4px;border-radius:99px;
    background:rgba(198,240,192,.25);outline:none;cursor:pointer}
  #obsSlider::-webkit-slider-thumb{-webkit-appearance:none;appearance:none;width:18px;height:18px;border-radius:50%;
    background:var(--stock);border:2px solid var(--ink);cursor:pointer}
  #obsSlider::-moz-range-thumb{width:18px;height:18px;border-radius:50%;background:var(--stock);border:2px solid var(--ink);cursor:pointer}
  .stagepick .chips{display:flex;flex-wrap:nowrap;gap:5px;justify-content:center;width:100%}
  /* each stage = a little movie ticket: round "tick" stub · dashed perforation · name, with notched ends.
     Natural width (so longer labels keep their room) + small font keeps all five on ONE row. */
  .schip{flex:0 0 auto;position:relative;display:inline-flex;align-items:stretch;padding:0;border:2px solid;
    border-radius:4px;background:transparent;cursor:pointer;font-family:var(--cond);font-weight:700;
    text-transform:uppercase;letter-spacing:.04em;font-size:clamp(8px,2.5vw,12px);line-height:1;white-space:nowrap;
    -webkit-mask:radial-gradient(circle 5px at 0 50%,#0000 97%,#000),radial-gradient(circle 5px at 100% 50%,#0000 97%,#000);
            mask:radial-gradient(circle 5px at 0 50%,#0000 97%,#000),radial-gradient(circle 5px at 100% 50%,#0000 97%,#000);
    -webkit-mask-composite:source-in;mask-composite:intersect;
    transition:opacity .15s ease,background .15s ease,color .15s ease}
  .schip .tick{flex:0 0 auto;width:10px;height:10px;border-radius:50%;border:2px solid currentColor;
    align-self:center;margin:8px 0 8px 7px;position:relative}
  .schip[aria-pressed="true"] .tick::after{content:"";position:absolute;inset:2px;border-radius:50%;background:currentColor}
  .schip .perf{border-left:2px dashed currentColor;opacity:.5;margin:4px 5px}
  .schip .lbl{align-self:center;padding-right:9px}
  .schip[aria-pressed="false"]{opacity:.5}
  /* narrow phones: squeeze the five tickets onto one row — drop the perforation, shrink */
  @media (max-width:560px){
    .stagepick .chips{gap:4px}
    .schip{font-size:clamp(7.5px,2.35vw,11px);letter-spacing:.02em}
    .schip .perf{display:none}
    .schip .tick{width:9px;height:9px;margin:7px 0 7px 6px}
    .schip .lbl{padding:0 7px}
  }

  /* tear-in-half pieces (cloned on click) */
  .tear{z-index:100;pointer-events:none;
    transition:transform .72s cubic-bezier(.5,0,.2,1), opacity .72s ease}
  .tear-top{clip-path:polygon(0 0,100% 0,100% 50%,87.5% 44%,75% 56%,62.5% 44%,50% 56%,37.5% 44%,25% 56%,12.5% 44%,0 50%)}
  .tear-bottom{clip-path:polygon(0 50%,12.5% 44%,25% 56%,37.5% 44%,50% 56%,62.5% 44%,75% 56%,87.5% 44%,100% 50%,100% 100%,0 100%)}
  .tear-top.go{transform:translateY(-165%) rotate(-5deg);opacity:0}
  .tear-bottom.go{transform:translateY(165%) rotate(5deg);opacity:0}

  .hidden{display:none!important}
  .toast{position:fixed;top:16px;left:50%;transform:translateX(-50%);z-index:20;border:2px solid var(--ink);border-radius:999px;
         padding:8px 18px;font-size:12px;font-weight:800;letter-spacing:.16em;text-transform:uppercase;color:var(--ink);
         opacity:0;transition:opacity .3s, top .3s;pointer-events:none}
  .toast.show{opacity:1;top:24px}
  /* tiny movie-ticket confetti (pastel stub + ink border + side-notch perforations) */
  .confetti-ticket{position:absolute;width:17px;height:11px;border:1.5px solid var(--ink);border-radius:2px;
    background-repeat:no-repeat;will-change:transform,opacity;
    background-image:radial-gradient(circle 2px at 0 50%, var(--bg) 2px, transparent 2.5px),
                     radial-gradient(circle 2px at 100% 50%, var(--bg) 2px, transparent 2.5px),
                     linear-gradient(var(--ink),var(--ink));
    background-size:100% 100%,100% 100%,1.5px 60%;
    background-position:0 0,0 0,center}

  /* ===================== DESKTOP / LANDSCAPE ===================== */
  /* "Projection / Auditorium": marquee on top, giant projected still, a row of 4 ticket "seats". */
  @media (min-width:1000px){
    body{justify-content:center;align-items:stretch}
    #app{max-width:1500px;width:100%;min-height:100dvh;margin:0 auto;
         display:flex;flex-direction:column;gap:12px;padding:18px 32px 12px}

    .topbar{align-items:center}
    .logo{font-size:16px;padding:9px 14px}
    .chip{font-size:12px;padding:6px 15px}

    /* MARQUEE — rank ladder as one wide horizontal admission ticket */
    .ladder{flex-direction:row;align-items:center;gap:28px;padding:14px 32px}
    .ladder .row{flex:0 0 auto;flex-direction:column;align-items:flex-start;gap:1px}
    .ladder .meta{font-size:10px}
    .ladder .score{font-size:28px}
    .ladder .track{flex:1 1 auto;min-width:160px}
    .ladder .bands{flex:0 0 auto;width:clamp(340px,32vw,520px)}

    /* PLAY AREA — the still is the hero, framed like a lit screen on black */
    .ticket{flex:1;display:flex;flex-direction:column;min-height:0;background:transparent;border-radius:0}
    .ticket>.scallop{display:none}              /* drop the card scallops; ticket motif lives in marquee + seats */
    .ticket .stub,.ticket>.perf,.ticket .foot{display:none}
    .ticket .body{flex:1;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:18px;padding:0;min-height:0}

    .framewrap{height:min(54vh,46vw);aspect-ratio:16/9;width:auto;max-width:96%;border:3px solid #14181a;
               box-shadow:0 0 0 10px #0d0f10,0 22px 60px rgba(0,0,0,.7)}
    .lives{flex:0 0 auto}
    .life{width:30px;height:17px}

    .potbar{width:min(1000px,92%);border-top:0;padding-top:0;justify-content:center;gap:20px}
    .pot{font-size:42px;color:var(--cyan)}
    .potlabel{color:rgba(198,240,192,.7)}
    .streak{margin-left:0;color:var(--cyan)}
    .hint{color:rgba(198,240,192,.55);margin:0}
    .hint::after{content:" · keys 1–4 to answer · Enter for next";opacity:.85}

    /* SEATS — the 4 choices as a row of mint ticket stubs */
    .choices{width:min(1000px,94%);display:grid;grid-template-columns:repeat(4,1fr);gap:16px;counter-reset:ch}
    .choice{background:var(--stock);color:var(--ink);border:2px solid var(--ink);border-radius:4px;min-height:76px;
            display:flex;align-items:center;justify-content:center;gap:10px;text-align:center;font-size:17px;padding:12px 14px;
            transition:background .12s,color .12s,transform .12s,box-shadow .12s}
    .choice::before{counter-increment:ch;content:counter(ch);flex:0 0 auto;width:1.7em;height:1.7em;border:2px solid var(--ink);
            border-radius:50%;display:inline-flex;align-items:center;justify-content:center;font-family:var(--cond);font-weight:800;font-size:13px}
    .choice:hover{transform:translateY(-3px);box-shadow:0 8px 18px rgba(0,0,0,.45)}
    .choice:hover::before{background:var(--ink);color:var(--stock)}
    .choice:focus-visible{outline:3px solid var(--ink);outline-offset:3px}
    .btn:focus-visible{outline:3px solid var(--stock);outline-offset:3px}
    .choice.correct{background:var(--stock);color:var(--ink);border-color:var(--good);outline:3px solid var(--good)}
    .choice.correct::before{background:var(--good);color:#fff;border-color:var(--good)}
    .choice.wrong{background:var(--stock);color:var(--ink);border-color:var(--bad);outline:3px solid var(--bad)}
    .choice.wrong::before{background:var(--bad);color:#fff;border-color:var(--bad)}

    /* overlays scaled up for the laptop */
    .panel,.menuticket{max-width:520px}
    .panel h1{font-size:40px}
    .panel h2{font-size:30px}
  }

  /* ===================== MOBILE — fit one screen, no scrolling ===================== */
  @media (max-width:999px){
    html,body{height:100%;overflow:hidden}
    body{align-items:stretch}
    #app{height:100dvh;max-width:520px;gap:8px;padding:10px 12px calc(8px + env(safe-area-inset-bottom));justify-content:flex-start}
    .ladder{padding:9px 22px;gap:6px}
    .ladder .score{font-size:20px}
    /* card sits just under the progress bar; the lives row drops to the bottom (margin-top:auto) */
    .ticket{flex:0 1 auto;display:flex;flex-direction:column;justify-content:center;min-height:0;padding:0;margin:6px 0 0}
    .lives{padding-bottom:2px}
    .ticket .stub,.ticket>.perf,.ticket .foot,.hint{display:none}        /* reclaim vertical space */
    .ticket .body{display:flex;flex-direction:column;align-items:center;gap:24px;padding:34px 22px}
    .framewrap{aspect-ratio:16/9;height:min(38vh,50vw);width:auto;max-width:100%}
    .potbar{border-top:0;padding-top:0;justify-content:center;gap:12px}
    .pot{font-size:26px}
    .choices{width:100%;display:grid;grid-template-columns:1fr 1fr;gap:10px}
    .choice{font-size:13px;line-height:1.2;padding:11px 10px;text-align:center;min-height:0;display:flex;align-items:center;justify-content:center}
    /* reveal popup stays compact on phones */
    .panel .pad{padding:30px 24px;gap:8px}
    .panel h1{font-size:26px}
    .panel h2{font-size:22px}
    .panel .delta{font-size:30px}
    #rvFrame{height:24vh;width:auto;aspect-ratio:16/9;max-width:100%;margin:0 auto}
  }
</style>
</head>
<body>

<script src="data/movies.js?v=10"></script>
<script>
(function(){
  "use strict";

  // ---- band config (the tuning table) ----
  // Each stage has a `goal` — fill the bar to that to clear the stage; then it resets and the next (harder) stage begins.
  // Every stage fills to 1000, but points-per-answer DIMINISH as you climb, so later stages are a longer grind.
  // Easy ≈ 4-5 quick answers; Cinephile ≈ 15+. Stings scale down with payouts so a miss ≈ one good answer.
  const BANDS = [
    {key:"easy",      name:"Easy",      goal:1000, pMax:240, pMin:120, T:22, sting:150, color:"--easy",      ibase:10},
    {key:"medium",    name:"Medium",    goal:1000, pMax:165, pMin:80,  T:26, sting:110, color:"--medium",    ibase:20},
    {key:"hard",      name:"Hard",      goal:1000, pMax:120, pMin:55,  T:30, sting:80,  color:"--hard",      ibase:35},
    {key:"veryhard",  name:"Very Hard", goal:1000, pMax:92,  pMin:42,  T:34, sting:60,  color:"--veryhard",  ibase:55},
    {key:"cinephile", name:"Cinephile", goal:1000, pMax:75,  pMin:34,  T:38, sting:48,  color:"--cinephile", ibase:80}
  ];
  // The ladder the game actually plays — a subset of BANDS chosen on the menu (defaults to all).
  let ACTIVE = BANDS.slice();
  const enabledStages = new Set(BANDS.map(b=>b.key));
  // obscurity: 0–100. Locked in from the menu slider. A film is eligible if it's core (always) or,
  // when the slider is above 0, if its obscurity rank is within the slider value. So 0 = core only.
  let obscurity = 0;
  const eligible = m => !m.obscure || (obscurity>0 && m.obs<=obscurity);

  // ---- state ----  stage = current mode index (0..4); progress = points in the current stage's bar
  // thinkTime = total seconds spent answering (drives the Reel Score speed term); wrong = misses this run.
  // mode = "classic" (the 5-stage climb) or "infinite" (post-win endurance run). Infinite fields live in S.inf.
  // lives = persistent ticket count (classic). A miss burns one; 5 correct in a row earns one back
  // (capped at MAX_LIVES). At full lives, a 5-streak instead lights a "hot" streak (+50/correct, shiny).
  const S = { stage:0, progress:0, streak:0, round:null, seen:[], lastChoices:null, thinkTime:0, wrong:0, lives:5, hot:false, mode:"classic", inf:null };   // seen = every film shown this game (no repeats); lastChoices = prior round's 4 titles
  const MAX_LIVES = 5;
  const HOT_BONUS = 50;          // extra points per correct while a hot streak is lit
  const STREAK_STEP = 5;         // correct-in-a-row needed to earn a ticket / light the streak

  function resetRun(){ S.stage=0; S.progress=0; S.streak=0; S.seen=[]; S.lastChoices=null; S.thinkTime=0; S.wrong=0; S.lives=MAX_LIVES; S.hot=false; S.mode="classic"; S.inf=null; }

  // ---- Reel Score (leaderboard score for a completed run) ----
  // completion base + speed (faster total think-time = more, capped) − accuracy penalty + flawless bonus.
  // Only a full 5-stage run at obscurity 0 is "ranked"; other configs still get a score, shown as practice.
  const SCORE = { base:8000, speedPool:8000, idealTime:140, mistakePenalty:250, flawlessBonus:2000 };
  // won=true → full completion; won=false (failed out) → base+speed prorated by how far you climbed.
  function reelScore(won){
    const goal = (ACTIVE[S.stage] && ACTIVE[S.stage].goal) || 1000;
    const barFrac = Math.max(0, Math.min(1, S.progress/goal));            // current bar, clamped (a failing sting can go negative)
    const frac = won ? 1 : Math.max(0, Math.min(1, (S.stage + barFrac) / ACTIVE.length));
    const speedFull = SCORE.speedPool * Math.min(1, SCORE.idealTime / Math.max(S.thinkTime, SCORE.idealTime));
    const base = Math.round(SCORE.base * frac);
    const speed = Math.round(speedFull * frac);
    const penalty = SCORE.mistakePenalty * S.wrong;
    const flawless = (won && S.wrong===0) ? SCORE.flawlessBonus : 0;
    const total = Math.max(0, base + speed - penalty + flawless);
    const ranked = ACTIVE.length===5 && obscurity===0;
    return { total, base, speed, penalty, flawless, wrong:S.wrong, time:Math.round(S.thinkTime), ranked, won:!!won };
  }

  // ---- infinite ("Keep Rolling") ----
  const INF_MAX_MISSES = 3;            // consecutive misses that end an infinite run (sudden death)
  const INF_WEIGHTS = { easy:1, medium:1, hard:2, veryhard:3, cinephile:3 };   // skew toward harder tiers
  const bandByKey = k => BANDS.find(b=>b.key===k) || BANDS[BANDS.length-1];
  // Pick the next infinite film from the whole eligible library, weighted toward harder tiers, no repeats.
  function pickMovieInfinite(){
    const seen = new Set(S.seen);
    let pool = MOVIES.filter(m=>eligible(m) && !seen.has(m.title));
    if(!pool.length) pool = MOVIES.filter(eligible);          // library exhausted (won't happen at 3.7k films)
    // weighted draw by difficulty tier
    let total=0; const weighted = pool.map(m=>{ const w=INF_WEIGHTS[m.difficulty]||1; total+=w; return {m,acc:total}; });
    let r=Math.random()*total; const hit=weighted.find(x=>r<x.acc) || weighted[weighted.length-1];
    const movie=hit.m; S.seen.push(movie.title); return movie;
  }
  function enterInfinite(){
    S.mode="infinite";
    S.streak=0; S.seen=[]; S.lastChoices=null;
    S.inf = { count:0, score:0, misses:0, best:0 };
    $("#winOv").classList.add("hidden");
    startRound();
  }

  // ---- lives (classic mode): movie tickets you burn on a miss and earn back with a 5-streak ----
  function ensureLives(){
    const wrap = $("#lives");
    if(wrap.children.length!==MAX_LIVES){ wrap.innerHTML=""; for(let i=0;i<MAX_LIVES;i++){ const t=document.createElement("i"); t.className="life"; wrap.appendChild(t); } }
    return wrap;
  }
  function renderLives(){
    const wrap = $("#lives");
    if(S.mode!=="classic"){ wrap.style.display="none"; return; }   // infinite uses its own strike pips
    wrap.style.display=""; ensureLives();
    [...wrap.children].forEach((t,i)=>{
      t.classList.remove("burning","earned");
      const intact = i < S.lives;
      t.classList.toggle("spent", !intact);
      t.classList.toggle("shiny", intact && S.hot);
    });
  }
  function burnLife(){                                   // called after S.lives-- : ticket at index S.lives is the one lost
    const wrap = ensureLives();
    [...wrap.children].forEach(c=>c.classList.remove("shiny"));   // hot streak is over
    const t = wrap.children[S.lives];
    if(t){ t.classList.remove("earned"); t.classList.add("burning"); setTimeout(()=>{ t.classList.remove("burning"); t.classList.add("spent"); }, 600); }
  }
  function earnLife(){                                    // called after S.lives++ : ticket at index S.lives-1 is restored
    const wrap = ensureLives();
    const t = wrap.children[S.lives-1];
    if(t){ t.classList.remove("spent","burning"); t.classList.add("earned"); if(S.hot) t.classList.add("shiny"); setTimeout(()=>t.classList.remove("earned"), 520); }
  }

  // ---- helpers ----
  const $ = s => document.querySelector(s);
  const cssVar = v => getComputedStyle(document.documentElement).getPropertyValue(v).trim();
  const setStock = v => document.documentElement.style.setProperty("--stock", cssVar(v));
  const rand = n => Math.floor(Math.random()*n);
  const shuffle = a => { a=a.slice(); for(let i=a.length-1;i>0;i--){const j=rand(i+1);[a[i],a[j]]=[a[j],a[i]];} return a; };
  const frameURL = f => f.indexOf("<svg")===0 ? "data:image/svg+xml;utf8,"+encodeURIComponent(f) : f;

  // ---- canvas / pixel engine ----
  const cv = $("#cv"), ctx = cv.getContext("2d");
  let img=null;

  // draw the still letterboxed (contain) so it keeps its real aspect ratio — never squeezed
  function draw(){
    ctx.fillStyle="#000"; ctx.fillRect(0,0,cv.width,cv.height);
    const iw=img.naturalWidth||img.width, ih=img.naturalHeight||img.height;
    if(!iw||!ih) return;
    const sc=Math.min(cv.width/iw, cv.height/ih), w=iw*sc, h=ih*sc;
    ctx.drawImage(img, (cv.width-w)/2, (cv.height-h)/2, w, h);
  }

  // ---- pot (time decay + spend) ----
  let startT=0, spent=0, tickId=null, autoId=null;
  function currentPot(){
    const b=S.round.band, frac=Math.min(1,(performance.now()-startT)/(b.T*1000));
    const decayed = b.pMax - (b.pMax-b.pMin)*frac;
    return Math.max(0, Math.round(decayed - spent));
  }
  function renderPot(){ $("#potNum").textContent = currentPot(); }

  // ---- round lifecycle ----
  function pickMovie(band){
    const tier = MOVIES.filter(m=>m.difficulty===band.key && eligible(m));
    const seen = new Set(S.seen);
    let pool = tier.filter(m=>!seen.has(m.title));
    if(!pool.length) pool = tier;                 // tier exhausted this game (won't happen with 200+ per tier)
    const movie = pool[rand(pool.length)];
    S.seen.push(movie.title);
    return movie;
  }
  // 3 fresh random decoys every round (never the same set) — same tier + similar era to stay fair.
  // `avoid` = titles shown last round; we keep them out so no answer text repeats back-to-back.
  function makeChoices(movie, band, avoid){
    const ans = movie.title, ak = ans.trim().toLowerCase(), yr = movie.year||0;
    const sameTier = MOVIES.filter(m => m.difficulty===band.key && eligible(m) && m.title.trim().toLowerCase()!==ak);
    const pools = [
      sameTier.filter(m => Math.abs((m.year||0)-yr) <= 15),  // same league, similar era
      sameTier,                                              // same league, any era
      MOVIES                                                 // last resort
    ];
    // First pass excludes last round's titles; if a small tier can't fill 3, relax that rule.
    const fill = (block) => {
      const used = new Set([ak]), decoys = [];
      for(const pool of pools){
        let guard = 0;
        while(decoys.length<3 && pool.length && guard++<500){
          const t = pool[rand(pool.length)].title, k = t.trim().toLowerCase();
          if(!used.has(k) && !(block && block.has(k))){ used.add(k); decoys.push(t); }
        }
        if(decoys.length>=3) break;
      }
      return decoys;
    };
    let decoys = fill(avoid);
    if(decoys.length<3) decoys = fill(null);   // relax: tier too small to also dodge last round
    return shuffle([ans, ...decoys]);
  }
  function startRound(){
    let band, movie;
    if(S.mode==="infinite"){ movie = pickMovieInfinite(); band = bandByKey(movie.difficulty); }
    else { band = ACTIVE[S.stage]; movie = pickMovie(band); }
    const frame = movie.frames[0];   // frames[0] = FILM-GRAB featured still (the representative image)
    const avoid = new Set((S.lastChoices||[]).map(t=>t.trim().toLowerCase()));
    const choices = makeChoices(movie, band, avoid);
    S.lastChoices = choices;
    S.round = { band, movie, frame, choices, answered:false };

    spent=0;

    setStock(band.color);
    document.documentElement.style.setProperty("--cyan", cssVar(band.color));  // chrome adopts the stage color
    renderLadder();
    renderLives();
    $("#serial").textContent = "N° " + String(1+rand(9998)).padStart(4,"0");
    $("#bandChip").textContent = band.name;
    const streakEl = $("#streak");
    streakEl.classList.toggle("hot", S.hot);
    streakEl.textContent = S.hot ? ("Hot · +"+HOT_BONUS) : (S.streak>=2 ? ("Streak ×"+S.streak) : "");

    // choices
    const cw=$("#choices"); cw.innerHTML="";
    S.round.choices.forEach(t=>{
      const b=document.createElement("button");
      b.className="choice"; b.textContent=t;
      b.onclick=()=>answer(b,t);
      cw.appendChild(b);
    });

    // load frame then start
    img = new Image();
    img.onload = ()=>{
      draw();
      startT = performance.now();
      renderPot();
      tickId = setInterval(renderPot, 100);
    };
    img.src = frameURL(frame);
  }

  function stopTimers(){ clearInterval(tickId); clearInterval(autoId); }

  function answer(btn, title){
    if(S.round.answered) return;
    S.round.answered=true; stopTimers();
    S.thinkTime += (performance.now()-startT)/1000;   // accumulate think-time for the Reel Score speed term
    const correct = title===S.round.movie.title;
    const band = S.round.band;
    let delta, evt = { promoted:false, won:false };

    if(S.mode==="infinite"){
      const frac = Math.min(1,(performance.now()-startT)/(band.T*1000));
      if(correct){
        const speed = 2 - frac;                              // 1.0 (at deadline) .. 2.0 (instant)
        const mult = 1 + 0.05*Math.min(S.streak,4);
        delta = Math.round(band.ibase * speed * mult);       // difficulty × speed × streak — no bar to fill
        S.inf.score += delta; S.inf.count++; S.streak++; S.inf.misses = 0;
      } else {
        delta = 0; S.streak = 0; S.inf.misses++;
        if(S.inf.misses >= INF_MAX_MISSES) evt.infOver = true;   // 3 in a row → cut!
      }
    } else {
      if(correct){
        const mult = 1 + 0.05*Math.min(S.streak,4);
        S.streak++;
        let earned = false;
        if(S.streak % STREAK_STEP === 0){                     // every 5th in a row…
          if(S.lives < MAX_LIVES){ S.lives++; earned = true; } // …earn a ticket back, or
          else S.hot = true;                                  // …at full tickets, light the hot streak
        }
        delta = Math.round(currentPot()*mult) + (S.hot ? HOT_BONUS : 0);
        S.progress += delta;
        if(S.progress >= band.goal){                          // bar filled → clear the stage
          if(S.stage === ACTIVE.length-1){ evt.won = true; S.progress = band.goal; }
          else { evt.promoted = true; S.stage++; S.progress -= band.goal; }   // carry overflow into the next, harder stage
        }
        if(earned) earnLife(); else renderLives();            // earn animates the restored ticket; else sync shine
      } else {
        S.wrong++; S.streak = 0; S.hot = false;
        S.lives--; burnLife();                                // burn a ticket
        delta = -band.sting;
        S.progress += delta;
        if(S.lives <= 0){ evt.failed = true; }                // out of tickets → out
        else if(S.progress < 0){
          if(S.stage > 0){ evt.relegated = true; S.stage--; S.progress = ACTIVE[S.stage].goal + S.progress; }  // fall back a stage
          else S.progress = 0;                                // can't fall below the first stage
        }
      }
    }

    // mark choice colors
    [...document.querySelectorAll(".choice")].forEach(b=>{
      b.disabled=true;
      if(b.textContent===S.round.movie.title) b.classList.add("correct");
      else if(b===btn && !correct) b.classList.add("wrong");
    });

    setTimeout(()=>showReveal(correct, delta, evt), 650);
  }

  // ---- stage-cleared toast ----
  function toastPromote(){
    const prev=ACTIVE[S.stage-1], cur=ACTIVE[S.stage];
    const t=$("#toast");
    t.textContent = prev.name+" cleared → "+cur.name;
    t.style.background = cssVar(cur.color);
    t.style.color = cssVar("--ink");
    t.classList.add("show");
    setTimeout(()=>t.classList.remove("show"), 1800);
    confettiBurst(32, 0.4);
  }

  function toastRelegate(){
    const cur=ACTIVE[S.stage];
    const t=$("#toast");
    t.textContent = "Relegated → "+cur.name;
    t.style.background = cssVar("--bad");
    t.style.color = "#fff";
    t.classList.add("show");
    setTimeout(()=>t.classList.remove("show"), 1800);
  }

  // ---- tiny movie-ticket confetti pop ----
  function confettiBurst(count, originYFrac){
    if(window.matchMedia && matchMedia("(prefers-reduced-motion: reduce)").matches) return;
    const cols=[cssVar(ACTIVE[S.stage].color), cssVar(ACTIVE[Math.max(0,S.stage-1)].color), "#ffffff"];
    const layer=document.createElement("div");
    layer.style.cssText="position:fixed;inset:0;pointer-events:none;z-index:90;overflow:hidden";
    document.body.appendChild(layer);
    const cx=window.innerWidth/2, cy=window.innerHeight*(originYFrac||0.4);
    for(let i=0;i<count;i++){
      const p=document.createElement("div");
      p.className="confetti-ticket";
      p.style.left=cx+"px"; p.style.top=cy+"px";
      p.style.backgroundColor=cols[i%cols.length];
      const s=0.7+Math.random()*0.9;
      const ang=-Math.PI/2 + (Math.random()-0.5)*Math.PI*1.15;   // fan upward
      const dist=90+Math.random()*240;
      const dx=Math.cos(ang)*dist, upy=Math.sin(ang)*dist;
      const fall=window.innerHeight*0.55 + Math.random()*140;
      const rot=Math.random()*900-450;
      layer.appendChild(p);
      p.animate([
        {transform:`translate(-50%,-50%) rotate(0deg) scale(${s})`, opacity:1},
        {transform:`translate(calc(-50% + ${dx*0.5}px), calc(-50% + ${upy}px)) rotate(${rot*0.4}deg) scale(${s})`, opacity:1, offset:0.4},
        {transform:`translate(calc(-50% + ${dx}px), calc(-50% + ${upy+fall}px)) rotate(${rot}deg) scale(${s})`, opacity:0}
      ], {duration:1300+Math.random()*700, easing:"cubic-bezier(.15,.6,.3,1)", fill:"forwards"});
    }
    setTimeout(()=>layer.remove(), 2200);
  }

  function showReveal(correct, delta, evt){
    const themeBand = S.mode==="infinite" ? S.round.band : ACTIVE[S.stage];   // infinite re-themes per film
    renderLadder();
    setStock(themeBand.color);
    document.documentElement.style.setProperty("--cyan", cssVar(themeBand.color));
    if(evt.won) return showWin();
    if(evt.failed) return showFail();
    if(evt.infOver) return showOver();
    if(evt.promoted) toastPromote();
    else if(evt.relegated) toastRelegate();
    const m=S.round.movie;
    $("#rvResult").textContent = correct ? "Correct" : "Wrong";
    $("#rvResult").style.color = correct ? cssVar("--good") : cssVar("--bad");
    if(S.mode==="infinite" && !correct) $("#rvDelta").textContent = "Strike "+S.inf.misses+"/"+INF_MAX_MISSES;
    else $("#rvDelta").textContent = (delta>=0?"+":"")+delta;
    $("#rvDelta").style.color = correct ? cssVar("--good") : cssVar("--bad");
    $("#rvFrame").src = frameURL(S.round.frame);
    $("#rvTitle").textContent = m.title;
    $("#rvMeta").innerHTML = "<li>"+m.year+" · "+m.director+"</li>";
    const lb=$("#rvLb");
    if(m.tmdbId){ lb.href="https://letterboxd.com/tmdb/"+m.tmdbId; lb.style.display=""; }
    else lb.style.display="none";
    $("#revealOv").classList.remove("hidden");
    renderLadder();
  }
  function scoreLines(s){
    const label = !s.won ? 'Reel Score · did not finish' : (s.ranked ? 'Reel Score' : 'Reel Score · practice run');
    return '<div class="bigscore">'+s.total.toLocaleString()+'</div>'+
      '<div class="scoresub">'+label+'</div>'+
      '<ul class="scorelines">'+
        '<li>'+(s.won?'Completion':'Progress')+' <b>+'+s.base.toLocaleString()+'</b></li>'+
        '<li>Speed <b>+'+s.speed.toLocaleString()+'</b> <span class="dim">('+s.time+'s)</span></li>'+
        (s.penalty?'<li>Mistakes <b>−'+s.penalty.toLocaleString()+'</b> <span class="dim">('+s.wrong+')</span></li>':'')+
        (s.flawless?'<li>Flawless <b>+'+s.flawless.toLocaleString()+'</b></li>':'')+
      '</ul>';
  }
  function showWin(){
    const last = ACTIVE[ACTIVE.length-1];
    setStock(last.color);
    document.documentElement.style.setProperty("--cyan", cssVar(last.color));
    $("#winResult").textContent = last.name;
    $("#winResult").style.color=cssVar("--ink");
    $("#winScore").innerHTML = scoreLines(reelScore(true));
    $("#winOv").classList.remove("hidden");
    confettiBurst(70, 0.32);
    setTimeout(()=>confettiBurst(50, 0.28), 380);
  }
  function showFail(){                                    // classic: 5 consecutive misses
    const reached = ACTIVE[S.stage];
    setStock(reached.color);
    document.documentElement.style.setProperty("--cyan", cssVar(reached.color));
    $("#overResult").textContent = "Cut!";
    $("#overResult").style.color = cssVar("--bad");
    $("#overCount").textContent = "Out at " + reached.name;
    $("#overScore").innerHTML = scoreLines(reelScore(false));
    $("#overOv").classList.remove("hidden");
  }
  function showOver(){
    if(S.inf.count > S.inf.best) S.inf.best = S.inf.count;
    $("#overResult").textContent = "Cut!";
    $("#overResult").style.color = cssVar("--bad");
    $("#overCount").textContent = S.inf.count + (S.inf.count===1?" Reel":" Reels");
    $("#overScore").innerHTML =
      '<div class="bigscore">'+S.inf.score.toLocaleString()+'</div>'+
      '<div class="scoresub">Infinite Score · '+S.inf.count+' survived</div>';
    $("#overOv").classList.remove("hidden");
  }

  // ---- ladder render ----
  function renderInfiniteHUD(){
    const band = S.round ? S.round.band : ACTIVE[S.stage];
    $("#scoreNum").textContent = S.inf.count;          // reels survived
    $("#goalNum").textContent = "∞";
    const pips = Array.from({length:INF_MAX_MISSES}, (_,i)=>'<i'+(i<S.inf.misses?' class="spent"':'')+'></i>').join('');
    $("#rankLabel").innerHTML = "Keep Rolling · " + S.inf.score.toLocaleString() + " pts" + '<span class="strikes">'+pips+'</span>';
    const fill=$("#fill"); fill.style.right="0%"; fill.style.background=cssVar(band.color);   // decorative full bar
    $("#bands").innerHTML = "";                          // no stage chips in infinite
  }
  function renderLadder(){
    if(S.mode==="infinite") return renderInfiniteHUD();
    const band = ACTIVE[S.stage];
    $("#scoreNum").textContent = S.progress;
    $("#goalNum").textContent = band.goal;
    $("#rankLabel").textContent = band.name + " · Stage " + (S.stage+1) + " / " + ACTIVE.length;
    const pct = Math.min(100, (S.progress/band.goal)*100);
    const fill=$("#fill");
    fill.style.right = (100-pct)+"%";
    fill.style.background = cssVar(band.color);
    const bandsEl=$("#bands"); bandsEl.innerHTML="";
    ACTIVE.forEach((b,i)=>{
      const el=document.createElement("b");
      el.textContent=b.name;
      if(i<S.stage){ el.classList.add("done"); el.style.background=cssVar(b.color); el.style.color=cssVar("--ink"); el.style.borderColor=cssVar(b.color); }
      else if(i===S.stage){ el.classList.add("on"); el.style.background=cssVar("--ink"); el.style.color=cssVar(b.color); el.style.borderColor=cssVar("--ink"); }
      bandsEl.appendChild(el);
    });
  }

  // ---- enter cinema: tear the ticket in half, then reveal the game ----
  function enterCinema(){
    const menu = $("#menuOv"), ticket = $("#enterBtn");
    const r = ticket.getBoundingClientRect();
    ACTIVE = BANDS.filter(b=>enabledStages.has(b.key));   // lock in the chosen stages for this game
    obscurity = +($("#obsSlider")?.value || 0);            // lock in the obscurity level
    resetRun();
    startRound();                                  // prepare the game behind the menu
    const mk = cls=>{
      const c = ticket.cloneNode(true); c.removeAttribute("id");
      c.className = ticket.className + " tear " + cls;
      c.style.cssText = "position:fixed;margin:0;left:"+r.left+"px;top:"+r.top+"px;width:"+r.width+"px;height:"+r.height+"px";
      document.body.appendChild(c); return c;
    };
    const top = mk("tear-top"), bot = mk("tear-bottom");
    ticket.style.visibility = "hidden";
    menu.classList.add("ripping");
    requestAnimationFrame(()=>requestAnimationFrame(()=>{ top.classList.add("go"); bot.classList.add("go"); }));
    setTimeout(()=>{ menu.classList.add("hidden"); top.remove(); bot.remove(); ticket.style.visibility=""; }, 800);
  }

  // ---- stage picker (menu) ----
  function renderStagePick(){
    const wrap=$("#stagePick"); wrap.innerHTML="";
    BANDS.forEach(b=>{
      const on=enabledStages.has(b.key), col=cssVar(b.color);
      const chip=document.createElement("button");
      chip.type="button"; chip.className="schip";
      chip.innerHTML='<span class="tick"></span><span class="perf"></span><span class="lbl"></span>';
      chip.querySelector(".lbl").textContent=b.name;
      chip.setAttribute("aria-pressed", on);
      chip.style.borderColor=col;
      chip.style.color = on ? cssVar("--ink") : col;
      chip.style.background = on ? col : "transparent";
      chip.onclick=()=>{
        if(enabledStages.has(b.key)){ if(enabledStages.size>1) enabledStages.delete(b.key); }  // keep ≥1
        else enabledStages.add(b.key);
        renderStagePick();
      };
      wrap.appendChild(chip);
    });
  }
  renderStagePick();

  // obscurity slider — live % label
  const obsSlider=$("#obsSlider"), obsVal=$("#obsVal");
  if(obsSlider) obsSlider.addEventListener("input", ()=>{ obsVal.textContent = obsSlider.value+"%"; });

  // ---- buttons ----
  $("#enterBtn").onclick = enterCinema;
  $("#nextBtn").onclick  = ()=>{ $("#revealOv").classList.add("hidden"); startRound(); };
  $("#wrapBtn").onclick  = ()=>{ resetRun(); $("#winOv").classList.add("hidden"); startRound(); };   // bank the run, start fresh
  $("#rollBtn").onclick  = ()=>{ enterInfinite(); };                                                  // continue into infinite
  $("#overAgainBtn").onclick = ()=>{ resetRun(); $("#overOv").classList.add("hidden"); startRound(); };

  // ---- keyboard: 1–4 answer, Enter advances ----
  const visible = el => el && !el.classList.contains("hidden") && getComputedStyle(el).display!=="none";
  document.addEventListener("keydown", e=>{
    const menu=$("#menuOv"), rev=$("#revealOv"), win=$("#winOv"), over=$("#overOv");
    if(e.key==="Enter"){
      if(visible(rev)){ e.preventDefault(); $("#nextBtn").click(); }
      else if(visible(win)){ e.preventDefault(); $("#wrapBtn").click(); }   // Enter = That's a Wrap (Keep Rolling needs a click)
      else if(visible(over)){ e.preventDefault(); $("#overAgainBtn").click(); }
      else if(visible(menu)){ e.preventDefault(); $("#enterBtn").click(); }
      return;
    }
    if(visible(menu)||visible(rev)||visible(win)||visible(over)) return;     // numbers only during live play
    if(S.round && S.round.answered) return;
    if(e.key>="1" && e.key<="4"){
      const btn=[...document.querySelectorAll(".choice")][+e.key-1];
      if(btn && !btn.disabled){ e.preventDefault(); btn.click(); }
    }
  });

  // build scalloped edges on every ticket-stock surface (larger arch centered)
  document.querySelectorAll(".stock").forEach(el=>{
    const sideways = el.classList.contains("sideways");
    const sides = sideways ? ["left","right"] : ["top","bottom"];
    const n = sideways ? 5 : 9;
    const mid = sideways ? -1 : (n-1)/2;   // sideways: uniform arches, no dominant middle
    sides.forEach(side=>{
      const s=document.createElement("div"); s.className="scallop "+side;
      for(let i=0;i<n;i++){ const a=document.createElement("i"); if(i===mid) a.className="big"; s.appendChild(a); }
      el.appendChild(s);
    });
  });

  setStock("--cyan");
  renderLadder();
})();
</script>
</body>
</html>
